<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 450" role="img" aria-labelledby="t d">
  <title id="t">Reading pipeline</title>
  <desc id="d">A manually entered reading is validated, assigned an app-defined category and written to a local SQLite store. History, trends, summaries and PDF or CSV export read from the local store. Reminders prompt the user to log, and an optional sync path mirrors data to a cloud copy for signed-in users.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e9e6f7; }
      .h { font-size: 24px; font-weight: 700; }
      .k { font-size: 12px; fill: #a99cf0; letter-spacing: 1.5px; font-weight: 700; }
      .b { font-size: 16px; font-weight: 600; }
      .s { font-size: 13px; fill: #b3adce; }
      .note { font-size: 13px; fill: #9f98c0; font-style: italic; }
      .in { fill: #2a2147; stroke: #8b7cf6; stroke-width: 2; }
      .core { fill: #1e2a4d; stroke: #5b78d6; stroke-width: 2; }
      .store { fill: #17323a; stroke: #3aa7a0; stroke-width: 2.5; }
      .out { fill: #1a2c3d; stroke: #4aa3d8; stroke-width: 2; }
      .side { fill: #2f2a1c; stroke: #d6a24a; stroke-width: 2; stroke-dasharray: 6 4; }
      .arrow { stroke: #7f8fe0; stroke-width: 2; fill: none; marker-end: url(#a); }
      .darrow { stroke: #d6a24a; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#ad); }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7f8fe0"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d6a24a"/>
    </marker>
  </defs>
  <rect width="1300" height="450" rx="16" fill="#121021"/>
  <text x="40" y="48" class="h">Reading pipeline: entered by the user, stored on the device first</text>

  <rect x="40" y="150" width="170" height="80" rx="12" class="in"/>
  <text x="58" y="178" class="k">STEP 1</text>
  <text x="58" y="202" class="b">Manual entry</text>
  <text x="58" y="220" class="s">stepper or typed</text>

  <rect x="250" y="150" width="170" height="80" rx="12" class="core"/>
  <text x="268" y="178" class="k">STEP 2</text>
  <text x="268" y="202" class="b">Validation</text>
  <text x="268" y="220" class="s">bounds + coherence</text>

  <rect x="460" y="150" width="170" height="80" rx="12" class="core"/>
  <text x="478" y="178" class="k">STEP 3</text>
  <text x="478" y="202" class="b">Categorisation</text>
  <text x="478" y="220" class="s">app-defined bands</text>

  <rect x="670" y="140" width="200" height="100" rx="12" class="store"/>
  <text x="688" y="170" class="k">STEP 4</text>
  <text x="688" y="196" class="b">Local SQLite store</text>
  <text x="688" y="216" class="s">source of truth for the UI</text>

  <rect x="930" y="66" width="330" height="52" rx="10" class="out"/>
  <text x="948" y="90" class="b">History and averages</text><text x="948" y="108" class="s">edit, delete, period filters</text>
  <rect x="930" y="132" width="330" height="52" rx="10" class="out"/>
  <text x="948" y="156" class="b">Trends and charts</text><text x="948" y="174" class="s">day, week, month, year, custom</text>
  <rect x="930" y="198" width="330" height="52" rx="10" class="out"/>
  <text x="948" y="222" class="b">Summary and insights</text><text x="948" y="240" class="s">rule-based; optional AI text for Pro</text>
  <rect x="930" y="264" width="330" height="52" rx="10" class="out"/>
  <text x="948" y="288" class="b">PDF and CSV export</text><text x="948" y="306" class="s">shared through the OS share sheet</text>

  <rect x="40" y="340" width="260" height="64" rx="12" class="side"/>
  <text x="58" y="368" class="b">Reminders</text><text x="58" y="388" class="s">local notifications per category</text>

  <rect x="670" y="340" width="200" height="64" rx="12" class="side"/>
  <text x="688" y="368" class="b">Sync queue</text><text x="688" y="388" class="s">optional, signed-in users</text>

  <rect x="930" y="340" width="330" height="64" rx="12" class="side"/>
  <text x="948" y="368" class="b">Cloud copy</text><text x="948" y="388" class="s">mirror of the local data</text>

  <path d="M210 190 H250" class="arrow"/>
  <path d="M420 190 H460" class="arrow"/>
  <path d="M630 190 H670" class="arrow"/>
  <path d="M870 175 C900 175 900 92 930 92" class="arrow"/>
  <path d="M870 185 C900 185 900 158 930 158" class="arrow"/>
  <path d="M870 195 C900 195 900 224 930 224" class="arrow"/>
  <path d="M870 205 C900 205 900 290 930 290" class="arrow"/>
  <path d="M170 340 C170 290 140 270 130 230" class="darrow"/>
  <text x="190" y="300" class="note">prompts the user to log</text>
  <path d="M770 240 V340" class="darrow"/>
  <path d="M870 372 H930" class="darrow"/>
  <text x="474" y="432" class="note">Nothing is recorded automatically: every value originates from the user.</text>
</svg>
